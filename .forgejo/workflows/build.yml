name: Build Kasha Installer

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare container and Install dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y \
            gcc \
            make \
            pkg-config \
            gtk+3-devel \
            xxd \
            sed \
            coreutils

      - name: Compile project
        run: make

      - name: Create tarball
        run: tar -cvf neko_installer.tar neko_installer

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: neko-installer-package
          path: neko_installer.tar