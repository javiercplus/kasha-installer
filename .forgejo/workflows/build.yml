name: Build Kasha Installer

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-medium
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            make \
            pkg-config \
            libgtk-3-dev \
            xxd \
            sed \
            coreutils

      - name: Compile project
        run: make

      - name: Create tarball
        run: tar -cvf neko_installer.tar neko_installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-installer-package
          path: neko_installer.tar
